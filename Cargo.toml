# gbtui — a terminal UI runtime extracted from Grok Build's TUI.
# Dependency direction is load-bearing (see docs/architecture.md):
#   gbtui-agent → gbtui → widgets → runtime → {input, terminal} → core
#   gbtui-actions → core
#   gbtui must not depend on gbtui-agent
# Never depend on xai-grok-* or on sources/grok-build.

[workspace]
resolver = "2"
members = [
    "crates/gbtui-core",
    "crates/gbtui-terminal",
    "crates/gbtui-input",
    "crates/gbtui-runtime",
    "crates/gbtui-widgets",
    "crates/gbtui-actions",
    "crates/gbtui",
    "crates/gbtui-agent",
    "crates/gbtui-markdown-core",
    "crates/gbtui-markdown",
    "examples/settings",
    "examples/chat",
    "examples/picker",
    "examples/agent",
    "examples/studio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
authors = ["gbtui contributors"]

[workspace.dependencies]
gbtui-core = { path = "crates/gbtui-core", version = "0.1.0" }
gbtui-terminal = { path = "crates/gbtui-terminal", version = "0.1.0" }
gbtui-input = { path = "crates/gbtui-input", version = "0.1.0" }
gbtui-runtime = { path = "crates/gbtui-runtime", version = "0.1.0" }
gbtui-widgets = { path = "crates/gbtui-widgets", version = "0.1.0" }
gbtui-actions = { path = "crates/gbtui-actions", version = "0.1.0" }
gbtui = { path = "crates/gbtui", version = "0.1.0" }
gbtui-agent = { path = "crates/gbtui-agent", version = "0.1.0" }
gbtui-markdown-core = { path = "crates/gbtui-markdown-core", version = "0.1.0" }
gbtui-markdown = { path = "crates/gbtui-markdown", version = "0.1.0" }

# Pinned to the Grok Build TUI stack this framework is extracted from.
ratatui = { version = "0.29", default-features = false, features = [
    "crossterm",
    "unstable-widget-ref",
] }
ratatui-core = "0.1"
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
unicode-width = "0.2"
unicode-segmentation = "1.12.0"
textwrap = "0.16"
tui-scrollbar = "0.2"
anstyle-parse = "0.2"
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "signal",
] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
supports-color = "3"
dark-light = "2"
strum = { version = "0.27", features = ["derive"] }
toml = "0.8"

# Optional rich-text renderer, matching the extracted Markdown stack.
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
url = "2"

# Optional image decoding/transport; not part of the default facade.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
regex = "1"

# Dev / example stack (versions match Grok Build).
ansi-width = "0.1"
arboard = "3.6"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
colored_json = "5"
criterion = "0.6"
fuzzy-matcher = "0.3.7"
ignore = "0.4"
itertools = "0.14"
lipsum = "0.9"
pretty_assertions = "1"
rand = "0.9"
serde_json = "1"
termwiz = { version = "0.23", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Keep the default set; deny extra lints in CI via `clippy -- -D warnings`.
